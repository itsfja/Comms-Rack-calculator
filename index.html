<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10" Rack U Calculator</title>
<style>
  :root {
    --bg: #0b0f17;
    --panel: #121826;
    --panel2: #1a2234;
    --line: #232d42;
    --text: #e6edf7;
    --muted: #8a96ab;
    --accent: #38bdf8;
    --accent2: #818cf8;
    --ok: #34d399;
    --warn: #fbbf24;
    --bad: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 600px at 70% -10%, #16233c 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
  }
  header { padding: 28px 32px 8px; }
  header h1 {
    font-size: 26px; font-weight: 700; letter-spacing: .3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .wrap { display: grid; grid-template-columns: 1fr 420px; gap: 20px; padding: 16px 32px 40px; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }

  .card {
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .card h2 { font-size: 15px; margin-bottom: 12px; color: var(--accent); }
  .card h2 small { color: var(--muted); font-weight: 400; }

  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 14px; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  select, input[type=number], input[type=text] {
    background: #0d1424; border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; outline: none;
  }
  select:focus, input:focus { border-color: var(--accent); }
  input[type=number] { width: 80px; }
  input[type=text] { width: 160px; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat {
    background: #0d1424; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; text-align: center;
  }
  .stat b { font-size: 20px; display: block; }
  .stat span { font-size: 11px; color: var(--muted); }
  .ok b { color: var(--ok); } .warn b { color: var(--warn); } .bad b { color: var(--bad); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; padding: 8px; border-bottom: 1px solid var(--line); }
  td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .qtyctl { display: flex; align-items: center; gap: 6px; }
  .qtyctl button, .del, .stllink {
    background: #16203a; border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; width: 24px; height: 24px; cursor: pointer; font-size: 13px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
  }
  .qtyctl button:hover, .del:hover, .stllink:hover { border-color: var(--accent); }
  .del { color: var(--bad); width: 28px; }
  .stllink { color: var(--accent); width: 28px; }
  .totu { font-weight: 700; color: var(--accent); text-align: center; }
  .ports { font-size: 10.5px; color: var(--muted); line-height: 1.5; max-width: 150px; }
  .note { font-size: 10px; color: var(--warn); }

  .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #2a3450; border-radius: 999px; cursor: pointer; transition: .15s; }
  .slider:before { content: ""; position: absolute; height: 12px; width: 12px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider:before { transform: translateX(16px); }

  .elevation { margin-top: 18px; }
  .rack {
    background: #0d1424; border: 2px solid #31405f; border-radius: 10px;
    padding: 14px 16px; display: flex; flex-direction: column-reverse; gap: 3px;
    min-height: 300px;
  }
  .ru { border: 1px solid var(--line); border-radius: 4px; font-size: 10.5px; color: var(--muted); padding: 0 8px; }
  .empty-ru { height: 22px; display: flex; align-items: center; gap: 8px; }
  .empty-ru .num { opacity: .4; width: 26px; }
  .empty-ru .fill { flex: 1; border-top: 1px dashed #26314d; }
  .dev-ru {
    height: 22px; display: flex; align-items: center; gap: 8px;
    color: #fff; font-weight: 600; position: relative; overflow: hidden;
  }
  .dev-ru .num { width: 26px; opacity: .6; font-weight: 400; }
  .dev-ru .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 1; }
  .dev-ru .tag { font-size: 9px; background: rgba(0,0,0,.35); padding: 1px 6px; border-radius: 999px; font-weight: 500; z-index: 1; }
  .dev-ru .panel-img {
    position: absolute; inset: 0; pointer-events: none;
    background-repeat: no-repeat; background-position: right center; background-size: auto 100%;
  }
  .dev-ru::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 6px, transparent 6px 12px);
  }
  .jack { box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }

  .hint { font-size: 11.5px; color: var(--muted); margin-top: 10px; line-height: 1.6; }
  .hint b { color: var(--text); }
  .footer-actions { display: flex; gap: 8px; margin-top: 12px; }
  .ghost {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    padding: 7px 12px; border-radius: 8px; font-size: 12px; cursor: pointer;
  }
  .ghost:hover { color: var(--text); border-color: var(--accent); }
  .devicon { margin-right: 6px; }

  .catalog { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .catalog-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 8px 0 6px; width: 100%; }
  .chip {
    background: #16203a; border: 1px solid var(--line); color: var(--text);
    padding: 7px 12px; border-radius: 999px; font-size: 12.5px; cursor: pointer;
    transition: all .15s;
  }
  .chip:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(56,189,248,.2); }
  .chip .u-badge { color: var(--accent); font-weight: 700; margin-left: 4px; }

  .toast {
    position: fixed; right: 24px; bottom: 24px; max-width: 360px; z-index: 50;
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border: 1px solid var(--accent); border-radius: 12px; padding: 14px 16px;
    box-shadow: 0 14px 40px rgba(0,0,0,.5);
  }
  .toast h3 { font-size: 13px; color: var(--accent); margin-bottom: 6px; }
  .toast p { font-size: 12px; color: var(--muted); margin-bottom: 10px; line-height: 1.5; }
  .toast p b { color: var(--text); }
  .toast a.btn {
    display: inline-block; background: var(--accent); color: #06121f; font-weight: 700;
    font-size: 12px; padding: 8px 14px; border-radius: 8px; text-decoration: none; margin-right: 8px;
  }
  .toast button.dismiss {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    font-size: 11px; padding: 8px 10px; border-radius: 8px; cursor: pointer;
  }
</style>
</head>
<body>
<header>
  <h1>🎛️ 10" Rack U Calculator</h1>
  <p>Plan your 10-inch rack: pick kit, allow a patch/jack panel per device, and watch the elevation fill live.</p>
</header>

<div class="wrap">
  <div class="card">
    <h2>Rack elevation <small>— fills bottom-up, front view</small></h2>

    <div class="controls">
      <div>
        <label>Rack height</label>
        <select id="rackSize">
          <option value="4">4U wall box</option>
          <option value="6">6U</option>
          <option value="9" selected>9U</option>
          <option value="10">10U</option>
          <option value="12">12U</option>
        </select>
      </div>
      <div>
        <label>Numbering</label>
        <select id="numScheme" title="How the rack numbers its U slots">
          <option value="b0" selected>Bottom U0, upwards</option>
          <option value="b1">Bottom U1, upwards</option>
          <option value="t1">Top U1, downwards</option>
        </select>
      </div>
      <div>
        <label>Jack panel U (per device)</label>
        <input type="number" id="jackU" min="0" max="2" step="1" value="1" title="U reserved for a patch/jack panel in front of each device">
      </div>
      <div>
        <label>Blank/filler U (spacer)</label>
        <input type="number" id="spacerU" min="0" max="4" step="1" value="0">
      </div>
    </div>

    <div class="stats">
      <div class="stat" id="stUsed"><b>0U</b><span>Used</span></div>
      <div class="stat" id="stFree"><b>0U</b><span>Free</span></div>
      <div class="stat" id="stPct"><b>0%</b><span>Utilisation</span></div>
      <div class="stat" id="stDev"><b>0</b><span>Devices</span></div>
    </div>

    <div class="catalog" id="catalog"></div>

    <div class="elevation"><div class="rack" id="rack"></div></div>
    <div class="hint" id="hint"></div>

    <div class="footer-actions">
      <button class="ghost" id="printBtn">🖨️ Print / PDF</button>
      <button class="ghost" id="resetBtn">↺ Reset rack</button>
    </div>
  </div>

  <div class="card">
    <h2>Build list <small>— your kit</small></h2>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr><th>#</th><th>Device</th><th>Ports</th><th>U</th><th>Qty</th><th>Jack</th><th>Tot U</th><th>STL</th><th></th></tr>
        </thead>
        <tbody id="buildTable"></tbody>
      </table>
    </div>

    <h2 style="margin-top:18px">Custom device</h2>
    <div class="controls" style="margin-bottom:0">
      <div>
        <label>Name</label>
        <input type="text" id="cName" placeholder="e.g. Media converter">
      </div>
      <div>
        <label>Height (U)</label>
        <input type="number" id="cU" min="1" max="4" step="1" value="1">
      </div>
      <div>
        <label>&nbsp;</label>
        <button class="chip" id="addCustom">＋ Add to rack</button>
      </div>
    </div>
  </div>
</div>

<div id="toastSlot"></div>

<script>
const KIT = [
  {
    key: "nuc10", name: "Intel NUC (10th gen)", u: 2, icon: "\ud83d\udda5\ufe0f",
    ports: ["2\u00d7 USB-A 3.2 Gen2", "1\u00d7 USB-C 3.2 Gen2", "1\u00d7 HDMI 2.0a", "1\u00d7 2.5GbE", "1\u00d7 3.5mm audio"],
    stl: { label: "Flow \u2014 10th Gen Intel NUC 10\" rackmount kit", url: "https://www.printables.com/model/450104-10th-gen-intel-nuc-10-inch-rackmount" },
    img: "https://media.printables.com/media/prints/450104/images/3708079_a11d82e9-d757-4062-8a57-3cf75735bef0/thumbs/cover/800x800/png/nuc10fnh-rack.png",
    note: "1.5U kit \u2014 occupies 2U of rail spacing"
  },
  {
    key: "pi4", name: "Raspberry Pi 4", u: 1, icon: "\ud83e\udd67",
    ports: ["2\u00d7 USB 3.0", "2\u00d7 USB 2.0", "1\u00d7 GbE", "2\u00d7 micro-HDMI", "USB-C power"],
    stl: { label: "Maur\u00edcio Pessoa \u2014 Raspberry Pi 4B 10\" rack mount (holds 2)", url: "https://www.printables.com/model/932007-raspberry-pi-4b-10-inch-rack-mount" },
    img: "https://media.printables.com/media/prints/932007/images/7104080_945003a9-e929-41af-9d84-b621a09fadd9_4996c33e-6d58-4896-941c-54125e7fa0c5/thumbs/cover/800x800/jpg/closeup.jpg",
    note: null
  },
  {
    key: "ucgfiber", name: "UniFi Cloud Gateway Fiber", u: 1, icon: "\ud83d\udee1\ufe0f",
    ports: ["1\u00d7 10G RJ45 WAN", "2\u00d7 10G SFP+", "4\u00d7 2.5GbE LAN (1\u00d7 PoE+)", "0.96\" display"],
    stl: { label: "Maur\u00edcio Pessoa \u2014 UCG-Fiber 10\" rack mount", url: "https://www.printables.com/model/1235928-unifi-ucg-fiber-10-inch-rack-mount" },
    img: "https://media.printables.com/media/prints/579878c3-d274-455c-a12a-c072e4d851d2/images/10172029_32754a7c-892d-4f0d-a3f0-3a714df42e42_0bfc5be2-1158-4e39-b9c2-989c61b2625f/thumbs/cover/800x800/png/cover01.png",
    note: null
  },
  {
    key: "flexmini", name: "UniFi Flex Mini", u: 1, icon: "\ud83d\udd0c",
    ports: ["4\u00d7 1GbE (1\u00d7 PoE out)", "USB-C power"],
    stl: { label: "Maur\u00edcio Pessoa \u2014 USW-Flex-Mini 10\" rack mount", url: "https://www.printables.com/model/1017871-ubiquiti-unifi-usw-flex-mini-10-inch-rack-mount" },
    img: "https://media.printables.com/media/prints/1017871/images/7732051_d3942643-8af1-47be-96dc-12d3dd351d94_43aff8f4-1cef-4ad9-af4a-96efd0d06cc9/thumbs/cover/800x800/png/modelsingle.png",
    note: "Mount holds 2 per 1U \u2014 stack your second Flex Mini"
  },
  {
    key: "flexmini25", name: "UniFi Flex Mini 2.5G", u: 1, icon: "\ud83d\udd0c",
    ports: ["4\u00d7 2.5GbE", "1\u00d7 2.5G SFP", "USB-C power"],
    stl: { label: "Maur\u00edcio Pessoa \u2014 USW-Flex-Mini 2.5G 10\" rack mount", url: "https://www.printables.com/model/1025246-ubiquiti-unifi-usw-flex-mini-25g-5-10-inch-rack-mo" },
    img: "https://media.printables.com/media/prints/1025246/images/7785020_c70dfefa-d1ec-4771-a9c5-aa0c8d7cce4e_108477ff-3bee-4f23-a1c2-b433d87f7979/thumbs/cover/800x800/png/model.png",
    note: "Mount holds 2 per 1U \u2014 stack your second Flex Mini 2.5G"
  },
  {
    key: "crs305", name: "MikroTik CRS305 (10G switch)", u: 1, icon: "\ud83d\udd00",
    ports: ["4\u00d7 10G SFP+", "1\u00d7 GbE", "DC power"],
    stl: { label: "Mauker \u2014 CRS305-1G-4S+IN 10\" rack mount", url: "https://www.printables.com/model/1343353-mikrotik-crs305-1g-4sin-10-inch-rack-mount" },
    img: "https://makerworld.bblmw.com/makerworld/model/US3657ace2fd1fcc/design/2025-07-01_076c568d685778.png",
    note: null
  },
  {
    key: "f4425pro", name: "TerraMaster F4-425 Pro", u: 4, icon: "\ud83d\udcbe",
    ports: ["2\u00d7 5GbE", "3\u00d7 USB-A 10Gbps", "1\u00d7 USB-C 10Gbps", "1\u00d7 HDMI"],
    stl: null,
    img: "https://www.terra-master.com/cdn/shop/files/F4-425-Pro-02.jpg",
    note: "15cm tall (~3.4U) \u2014 shelf mount, pokes out the back"
  }
];

const GENERIC = [
  { key: "sw8", name: "1U Switch (8\u201312p)", u: 1, icon: "\ud83d\udd00", ports: null, stl: null, img: null, note: null },
  { key: "sw24", name: "1U Switch (24p)", u: 1, icon: "\ud83d\udd00", ports: null, stl: null, img: null, note: null },
  { key: "rtr", name: "Router / Firewall", u: 1, icon: "\ud83d\udee1\ufe0f", ports: null, stl: null, img: null, note: null },
  { key: "pp24", name: "Patch panel (24p)", u: 1, icon: "\ud83e\ude9b", ports: null, stl: null, img: null, note: null },
  { key: "nvr", name: "NVR / DVR", u: 2, icon: "\ud83d\udc9a", ports: null, stl: null, img: null, note: null },
  { key: "ups", name: "UPS (1U)", u: 1, icon: "\ud83d\udd0b", ports: null, stl: null, img: null, note: null },
  { key: "pdu", name: "Rack PDU", u: 1, icon: "\ud83d\udd0c", ports: null, stl: null, img: null, note: null },
  { key: "shelf", name: "Shelf (passive, 0U)", u: 0, icon: "\ud83d\uddc4\ufe0f", ports: null, stl: null, img: null, note: null },
  { key: "fan", name: "Fan tray", u: 1, icon: "\ud83c\udf00", ports: null, stl: null, img: null, note: null }
];

let state = { rackSize: 9, jackU: 1, spacerU: 0, numScheme: "b0", items: [], downloaded: [] };
try {
  const s = JSON.parse(localStorage.getItem("rack-calc") || "null");
  if (s && Array.isArray(s.items)) state = Object.assign(state, s);
  if (!Array.isArray(state.downloaded)) state.downloaded = [];
} catch (e) {}

const $ = id => document.getElementById(id);
const save = () => localStorage.setItem("rack-calc", JSON.stringify(state));

const COLORS = ["#38bdf8","#818cf8","#34d399","#fbbf24","#f472b6","#fb923c","#a78bfa","#2dd4bf"];

function slotLabel(i, size) {
  const sc = state.numScheme;
  if (sc === "b0") return "U" + i;
  if (sc === "b1") return "U" + (i + 1);
  return "U" + (size - i);
}

function itemTotal(it) {
  if (it.u === 0) return 0;
  const jack = it.jack && state.jackU > 0 ? state.jackU : 0;
  return (it.u + jack) * it.qty;
}

function showStlOffer(dev) {
  if (!dev.stl) return;
  if (state.downloaded.includes(dev.key)) return;
  state.downloaded.push(dev.key);
  save();
  const slot = $("toastSlot");
  slot.innerHTML = `
    <div class="toast">
      <h3>\ud83e\udde9 3D-print mount available</h3>
      <p><b>${dev.name}</b> (${dev.u}U) has a 10" rack-mount STL.
      ${dev.note ? "<br><span class='note'>\u26a0 " + dev.note + "</span>" : ""}</p>
      <a class="btn" href="${dev.stl.url}" target="_blank" rel="noopener">Download STL \u2197</a>
      <button class="dismiss" id="toastDismiss">Close</button>
    </div>`;
  $("toastDismiss").addEventListener("click", () => { slot.innerHTML = ""; });
}

function addItem(dev) {
  state.items.push({
    key: dev.key, name: dev.name, u: dev.u, qty: 1,
    jack: dev.key === "pp24",
    color: COLORS[state.items.length % COLORS.length],
    icon: dev.icon, ports: dev.ports, stl: dev.stl, img: dev.img, note: dev.note
  });
  rebuild();
  showStlOffer(dev);
}

function rebuild() {
  const rack = $("rack");
  const used = state.items.reduce((a, it) => a + itemTotal(it), 0);
  const over = Math.max(0, used - state.rackSize);
  const size = state.rackSize;

  const rows = [];
  state.items.forEach(it => {
    for (let q = 0; q < it.qty; q++) {
      rows.push({
        name: it.name, u: it.u, tag: it.u + "U", color: it.color, icon: it.icon, img: it.img,
        jackAfter: it.jack && state.jackU > 0 ? state.jackU : 0
      });
    }
  });

  let pos = 0;
  const out = [];
  const render = (name, icon, tag, color, jack, img) => {
    out.push(block(name, icon, tag, color, pos, jack, img));
    pos += 1;
  };
  for (const r of rows) {
    if (pos >= size) break;
    if (r.u === 0) continue;
    render(r.name, r.icon, r.tag, r.color, false, r.img);
    for (let j = 1; j < r.u && pos < size; j++) render("", "", "", r.color, false, null);
    for (let j = 0; j < r.jackAfter && pos < size; j++) render("", "", state.jackU + "U", "#64748b", true, null);
  }
  for (let s = 0; s < state.spacerU && pos < size; s++) render("Blank / ventilation", "\u25ab\ufe0f", "1U", "#3b4666", false, null);
  for (let i = pos; i < size; i++) {
    out.push(`<div class="ru empty-ru"><span class="num">${slotLabel(i, size)}</span><span class="fill"></span><span style="opacity:.35;font-size:9px">free</span></div>`);
  }
  if (over > 0) {
    out.push(`<div class="ru empty-ru" style="border-color:var(--bad)"><span class="num" style="color:var(--bad)">!</span><span class="fill" style="border-color:var(--bad)"></span><span style="color:var(--bad);font-size:10px">\u26a0 ${over}U over capacity</span></div>`);
  }
  rack.innerHTML = out.join("");

  const pct = Math.round((used / size) * 100);
  $("stUsed").innerHTML = `<b>${used}U</b><span>Used</span>`;
  $("stFree").innerHTML = `<b>${Math.max(0, size - used)}U</b><span>Free</span>`;
  const pc = $("stPct");
  pc.className = "stat " + (pct > 100 ? "bad" : pct >= 90 ? "warn" : "ok");
  pc.innerHTML = `<b>${pct}%</b><span>Utilisation</span>`;
  $("stDev").innerHTML = `<b>${state.items.reduce((a, i) => a + i.qty, 0)}</b><span>Devices</span>`;

  $("hint").innerHTML =
    `Total kit: <b>${used}U</b> in a <b>${size}U</b> 10" rack. ` +
    (over > 0
      ? `\u26a0 You're <b>${over}U over</b> \u2014 remove kit, shrink jack panel U, or pick a taller rack.`
      : used === size
        ? `\u2705 Perfect fit \u2014 rack is full.`
        : `\u2705 Fits with <b>${size - used}U</b> to spare (or for growth).`);

  const tb = $("buildTable");
  tb.innerHTML = state.items.length ? state.items.map((it, i) => `
    <tr>
      <td>${i + 1}</td>
      <td>${it.icon || "\ud83d\udce6"} ${it.name}${it.note ? `<br><span class="note">\u26a0 ${it.note}</span>` : ""}</td>
      <td>${it.ports ? `<div class="ports">${it.ports.join("<br>")}</div>` : "\u2014"}</td>
      <td style="text-align:center">${it.u}U${it.jack && state.jackU > 0 ? `+${state.jackU}` : ""}</td>
      <td><div class="qtyctl">
        <button data-a="dec" data-i="${i}">\u2212</button><span>${it.qty}</span><button data-a="inc" data-i="${i}">\uff0b</button>
      </div></td>
      <td><label class="switch"><input type="checkbox" data-a="jack" data-i="${i}" ${it.jack ? "checked" : ""}><span class="slider"></span></label></td>
      <td class="totu">${itemTotal(it)}U</td>
      <td>${it.stl ? `<a class="stllink" href="${it.stl.url}" target="_blank" rel="noopener" title="${it.stl.label}">\u2b07</a>` : "\u2014"}</td>
      <td><button class="del" data-a="del" data-i="${i}">\u2715</button></td>
    </tr>`).join("")
    : `<tr><td colspan="9" style="color:var(--muted);text-align:center;padding:20px">Add kit from the catalogue above \u2191</td></tr>`;

  $("rackSize").value = state.rackSize;
  $("numScheme").value = state.numScheme;
  $("jackU").value = state.jackU;
  $("spacerU").value = state.spacerU;
  save();
}

function block(name, icon, tag, color, uNum, jack, img) {
  const bg = jack ? "#475569" : `linear-gradient(180deg,${color},${color}cc)`;
  const label = jack ? "\ud83e\ude9b Jack / patch panel" : `<span class="devicon">${icon || "\ud83d\udce6"}</span>${name}`;
  const imgEl = img
    ? `<span class="panel-img" style="background-image:url('${img}')"></span>`
    : "";
  return `<div class="ru dev-ru jack" style="background:${bg}">` +
    imgEl +
    `<span class="num">${slotLabel(uNum, state.rackSize)}</span><span class="name">${label}</span>` +
    (tag ? `<span class="tag">${tag}</span>` : "") + `</div>`;
}

$("catalog").innerHTML =
  `<span class="catalog-title">Your kit</span>` +
  KIT.map((d, i) => `<button class="chip" data-kit="${i}">${d.icon} ${d.name}<span class="u-badge">${d.u}U</span></button>`).join("") +
  `<span class="catalog-title">Generic</span>` +
  GENERIC.map((d, i) => `<button class="chip" data-gen="${i}">${d.icon} ${d.name}</button>`).join("");

$("catalog").addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t || !t.dataset) return;
  if (t.dataset.kit !== undefined) addItem(KIT[+t.dataset.kit]);
  else if (t.dataset.gen !== undefined) addItem(GENERIC[+t.dataset.gen]);
});

$("buildTable").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  const i = +b.dataset.i, a = b.dataset.a;
  if (a === "inc") state.items[i].qty++;
  if (a === "dec") { state.items[i].qty--; if (state.items[i].qty < 1) state.items.splice(i, 1); }
  if (a === "del") state.items.splice(i, 1);
  rebuild();
});

$("buildTable").addEventListener("change", e => {
  if (e.target.dataset.a === "jack") {
    state.items[+e.target.dataset.i].jack = e.target.checked;
    rebuild();
  }
});

$("addCustom").addEventListener("click", () => {
  const name = $("cName").value.trim();
  const u = Math.max(1, Math.min(4, +$("cU").value || 1));
  if (!name) { $("cName").focus(); return; }
  addItem({ key: "custom-" + name, name, u, icon: "\ud83d\udce6", ports: null, stl: null, img: null, note: null });
  $("cName").value = "";
});

$("rackSize").addEventListener("change", e => { state.rackSize = +e.target.value; rebuild(); });
$("numScheme").addEventListener("change", e => { state.numScheme = e.target.value; rebuild(); });
$("jackU").addEventListener("input", e => { state.jackU = Math.max(0, Math.min(2, +e.target.value || 0)); rebuild(); });
$("spacerU").addEventListener("input", e => { state.spacerU = Math.max(0, Math.min(4, +e.target.value || 0)); rebuild(); });
$("printBtn").addEventListener("click", () => window.print());
$("resetBtn").addEventListener("click", () => {
  state.items = []; state.spacerU = 0; rebuild();
});

rebuild();
</script>
</body>
</html>
